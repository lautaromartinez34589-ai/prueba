<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Session Log</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.png">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #080808;
      color: #f0f0f0;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .header-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .profile-tag {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      background: #141414;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid #222;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    .stats-container {
      display: flex;
      width: 100%;
      max-width: 320px;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #121212;
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #222;
      text-align: center;
    }
    .stat-card small { color: #666; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card div { font-size: 1.4rem; font-weight: 900; color: #fff; margin-top: 4px; }

    /* Grilla fija de fotos del código */
    .visual-grid-container {
      width: 100%;
      max-width: 320px;
      height: 180px;
      background: #0d0d0d;
      border-radius: 14px;
      border: 1px solid #222;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 20px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }
    .grid-foto {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #333;
      animation: fadeIn 0.3s ease;
    }
    .empty-grid-text {
      color: #444;
      font-size: 0.85rem;
      margin: auto;
      text-align: center;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .main-btn {
      background: #fff;
      color: #000;
      border: none;
      width: 100%;
      max-width: 320px;
      padding: 18px;
      font-size: 1.4rem;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 16px;
      letter-spacing: 1px;
      transition: transform 0.1s, background 0.2s;
    }
    .main-btn:active { transform: scale(0.97); background: #ddd; }

    .grid-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 320px;
      margin-bottom: 24px;
    }
    .option-btn {
      background-color: #121212;
      color: #ccc;
      border: 1px solid #222;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
    .option-btn:active { background: #222; }

    .history-section { width: 100%; max-width: 320px; }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 140px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #141414;
      font-size: 0.9rem;
    }
    .btn-clear {
      background: none; border: none; color: #ff3b30;
      font-size: 0.75rem; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <div class="profile-tag" onclick="cambiarNombre()" id="display-nombre">PEDRO</div>
  </div>

  <div class="stats-container">
    <div class="stat-card">
      <small>Total Gramos</small>
      <div id="total-grams">0</div>
    </div>
    <div class="stat-card">
      <small>Rango</small>
      <div id="rango-actual" style="font-size: 1rem; margin-top: 6px;">Iniciado</div>
    </div>
  </div>

  <!-- Grilla visual de tus fotos oficiales del repositorio -->
  <div class="visual-grid-container" id="grid-fotos">
    <div class="empty-grid-text">Cargá fotos en GitHub para verlas acá</div>
  </div>

  <button class="main-btn" onclick="registrar(1)">+ 1G</button>

  <div class="grid-options">
    <button class="option-btn" onclick="registrar(0.5)">+ 0.5g</button>
    <button class="option-btn" onclick="registrar(2)">+ 2g</button>
    <button class="option-btn" onclick="registrar(3)">+ 3g</button>
    <button class="option-btn" onclick="registrar(4)">+ 4g</button>
    <button class="option-btn" onclick="registrar(5)">+ 5g</button>
  </div>

  <div class="history-section">
    <div class="history-header">
      <span>Registro</span>
      <button class="btn-clear" onclick="limpiarHistorial()">Borrar todo</button>
    </div>
    <ul class="history-list" id="history-list"></ul>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let registros = JSON.parse(localStorage.getItem('registros_gramos')) || [];
    let miNombre = localStorage.getItem('mi_nombre') || 'PEDRO';

    document.getElementById('display-nombre').textContent = miNombre;

    // FOTOS FIJAS DEL REPOSITORIO (Modificá los nombres según tus archivos subidos)
    const misFotos = [
      "cogollo1.png",
      "cogollo2.png"
    ];

    function cambiarNombre() {
      const nuevo = prompt('Nuevo alias:', miNombre);
      if (nuevo && nuevo.trim() !== '') {
        miNombre = nuevo.trim().toUpperCase();
        localStorage.setItem('mi_nombre', miNombre);
        document.getElementById('display-nombre').textContent = miNombre;
      }
    }

    function obtenerTitulo(gramos) {
      if (gramos >= 100) return 'BOSS';
      if (gramos >= 50) return 'VETERANO';
      if (gramos >= 20) return 'PESADO';
      if (gramos >= 5) return 'ACTIVO';
      return 'INICIADO';
    }

    function actualizarUI() {
      const historyList = document.getElementById('history-list');
      const totalSpan = document.getElementById('total-grams');
      const rangoSpan = document.getElementById('rango-actual');
      const gridContainer = document.getElementById('grid-fotos');
      
      historyList.innerHTML = '';
      let total = 0;

      registros.forEach((reg) => {
        total += reg.gramos;
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span style="color:#666">${reg.fecha}</span> <strong style="color:#fff">+${reg.gramos}G</strong>`;
        historyList.appendChild(li);
      });

      totalSpan.textContent = total.toFixed(1);
      rangoSpan.textContent = obtenerTitulo(total);

      // Renderizar las fotos del repositorio según los gramos
      gridContainer.innerHTML = '';
      let cantidadFotos = Math.floor(total);

      if (misFotos.length === 0) {
        gridContainer.innerHTML = '<div class="empty-grid-text">Agregá fotos en el código</div>';
      } else if (cantidadFotos > 0) {
        for (let i = 0; i < cantidadFotos; i++) {
          let fotoSrc = misFotos[i % misFotos.length];
          const img = document.createElement('img');
          img.className = 'grid-foto';
          img.src = fotoSrc;
          gridContainer.appendChild(img);
        }
      }
    }

    function registrar(gramos) {
      const ahora = new Date();
      const fechaStr = ahora.toLocaleDateString([], {day: '2-digit', month: '2-digit'}) + ' ' + 
                       ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      registros.unshift({ fecha: fechaStr, gramos: gramos });
      localStorage.setItem('registros_gramos', JSON.stringify(registros));
      actualizarUI();
    }

    function limpiarHistorial() {
      if (confirm('¿Borrar todo el historial?')) {
        registros = [];
        localStorage.removeItem('registros_gramos');
        actualizarUI();
      }
    }

    actualizarUI();
  </script>
</body>
</html>
