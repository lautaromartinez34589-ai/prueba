<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Registro</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.png">
  
  <style>
    /* TEMA POR DEFECTO (Oscuro Moderno) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    h1 { font-size: 1.4rem; margin-bottom: 16px; color: #4CAF50; }
    
    .top-bar {
      display: flex; width: 100%; max-width: 320px; margin-bottom: 20px; gap: 10px;
    }
    .top-bar select {
      flex-grow: 1; padding: 12px; border-radius: 12px; background: #1e1e1e;
      color: #4CAF50; border: 1px solid #333; font-size: 1.1rem; font-weight: bold; outline: none;
    }
    .btn-icon {
      background: #333; color: white; border: none; border-radius: 12px;
      padding: 0 16px; font-size: 1.2rem; cursor: pointer; font-weight: bold;
    }

    .total-box {
      background-color: #1e1e1e; width: 100%; max-width: 320px; padding: 12px;
      border-radius: 16px; text-align: center; margin-bottom: 20px; font-size: 1.1rem; border: 1px solid #2a2a2a;
    }
    .total-box span { font-size: 1.5rem; font-weight: bold; color: #4CAF50; }

    .sala-container {
      width: 100%; max-width: 320px; height: 220px; background-color: #0d0d0d;
      border-radius: 16px; border: 2px dashed #333; display: flex;
      justify-content: center; align-items: center; margin-bottom: 24px; overflow: hidden;
    }
    .sala {
      background: linear-gradient(to bottom, #2a2a2a, #1a1a1a); border: 2px solid #555;
      border-radius: 12px; display: flex; justify-content: center; align-items: flex-end;
      padding: 10px; transition: width 0.6s ease, height 0.6s ease; width: 100px; height: 100px;
    }
    .frasco {
      width: 100%; height: 100%; border: 3px solid rgba(255,255,255,0.4);
      border-top: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px; background: rgba(255,255,255,0.05);
      display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center;
      padding: 5px; overflow: hidden; box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
    }
    .cogollo { font-size: 20px; margin: 1px; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes pop { 0% { transform: scale(0) translateY(-20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

    .main-btn {
      background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; border: none;
      width: 100%; max-width: 320px; padding: 20px; font-size: 1.6rem; font-weight: bold;
      border-radius: 20px; cursor: pointer; box-shadow: 0 6px 20px rgba(76,175,80,0.3); margin-bottom: 20px;
    }
    .main-btn:active { transform: scale(0.96); }

    .grid-options { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 320px; margin-bottom: 24px; }
    .option-btn {
      background-color: #1e1e1e; color: #4CAF50; border: 1px solid #333; padding: 10px 16px;
      font-size: 0.9rem; font-weight: 600; border-radius: 12px; cursor: pointer;
    }

    .list-section { width: 100%; max-width: 320px; margin-bottom: 24px; }
    .list-header {
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a;
      padding-bottom: 8px; margin-bottom: 12px; font-size: 0.95rem; color: #aaa;
    }
    .data-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
    .ranking-item {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 10px;
      border-bottom: 1px solid #1a1a1a; background: #191919; border-radius: 8px; margin-bottom: 6px;
    }
    .ranking-info { display: flex; flex-direction: column; }
    .ranking-name { font-size: 1.1rem; font-weight: bold; }
    .ranking-title { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .ranking-score { color: #4CAF50; font-weight: bold; font-size: 1.1rem; }
    .btn-clear { background: none; border: none; color: #ff5252; font-size: 0.8rem; cursor: pointer; }

    /* =========================================
       TEMA Y2K / BLING ERA / CAMARA VIEJA
       ========================================= */
    body.y2k-theme {
      background-color: #c0c0c0;
      color: #000;
      font-family: "Courier New", Courier, monospace;
    }
    body.y2k-theme h1 { color: #000080; text-shadow: 2px 2px 0px #fff; font-weight: 900; }
    body.y2k-theme .top-bar select, body.y2k-theme .btn-icon {
      background: #dfdfdf; color: #000; border: 2px inset #fff; border-radius: 0; font-family: "Courier New", Courier, monospace; font-weight: bold;
    }
    body.y2k-theme .total-box {
      background: #fff; color: #000; border: 3px ridge #fff; border-radius: 0; box-shadow: 4px 4px 0px #000;
    }
    body.y2k-theme .total-box span { color: #ff00ff; }
    body.y2k-theme .sala-container {
      background-color: #000; border: 4px ridge #888; border-radius: 0; box-shadow: inset 0 0 10px #000;
    }
    body.y2k-theme .sala { border: 2px solid #00ff00; border-radius: 0; background: #111; }
    body.y2k-theme .frasco { border: 2px solid #00ff00; border-radius: 0; box-shadow: none; }
    body.y2k-theme .main-btn {
      background: linear-gradient(to bottom, #e6e6e6, #999999); color: #000;
      border: 4px outset #fff; border-radius: 0; box-shadow: 5px 5px 0px #000; font-family: "Impact", sans-serif; letter-spacing: 2px;
    }
    body.y2k-theme .main-btn:active { border: 4px inset #fff; transform: none; box-shadow: 2px 2px 0px #000; }
    body.y2k-theme .option-btn {
      background: #dfdfdf; color: #000; border: 2px outset #fff; border-radius: 0; font-family: "Courier New", Courier, monospace; font-weight: bold;
    }
    body.y2k-theme .option-btn:active { border: 2px inset #fff; }
    body.y2k-theme .list-header { color: #000; border-bottom: 2px dashed #888; }
    body.y2k-theme .ranking-item {
      background: #fff; border: 2px ridge #ddd; border-radius: 0; box-shadow: 2px 2px 0px #888;
    }
    body.y2k-theme .ranking-title { color: #000080; font-weight: bold; }
    body.y2k-theme .ranking-score { color: #ff00ff; }
    body.y2k-theme .data-item { border-bottom: 1px dashed #888; }
    body.y2k-theme .data-item span { color: #555 !important; }
  </style>
</head>
<body>

  <h1>Anotador</h1>

  <div class="top-bar">
    <select id="amigo-select" onchange="actualizarUI()"></select>
    <button class="btn-icon" onclick="agregarAmigo()">+</button>
    <button class="btn-icon" onclick="toggleY2K()">💿</button>
  </div>

  <div class="total-box">
    Total personal: <br><span id="total-grams">0</span> g
  </div>

  <div class="sala-container">
    <div class="sala" id="sala">
      <div class="frasco" id="frasco"></div>
    </div>
  </div>

  <button class="main-btn" onclick="registrar(1)">+ 1 g</button>

  <div class="grid-options">
    <button class="option-btn" onclick="registrar(0.5)">+ 0.5g</button>
    <button class="option-btn" onclick="registrar(2)">+ 2g</button>
    <button class="option-btn" onclick="registrar(3)">+ 3g</button>
    <button class="option-btn" onclick="registrar(4)">+ 4g</button>
    <button class="option-btn" onclick="registrar(5)">+ 5g</button>
  </div>

  <!-- Ranking General -->
  <div class="list-section">
    <div class="list-header">
      <span style="font-weight:bold;">🏆 Ranking de la banda</span>
    </div>
    <ul class="data-list" id="ranking-list" style="max-height: none;"></ul>
  </div>

  <!-- Historial Individual -->
  <div class="list-section">
    <div class="list-header">
      <span>Historial personal</span>
      <button class="btn-clear" onclick="limpiarHistorial()">Borrar todo</button>
    </div>
    <ul class="data-list" id="history-list"></ul>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let registros = JSON.parse(localStorage.getItem('registros_gramos')) || [];
    let amigos = JSON.parse(localStorage.getItem('lista_amigos')) || ['Pedro'];
    let y2kActivado = localStorage.getItem('y2k_theme') === 'true';

    // Aplicar tema al iniciar
    if (y2kActivado) document.body.classList.add('y2k-theme');

    function toggleY2K() {
      document.body.classList.toggle('y2k-theme');
      localStorage.setItem('y2k_theme', document.body.classList.contains('y2k-theme'));
    }

    function inicializarSelect() {
      const select = document.getElementById('amigo-select');
      const valorActual = select.value;
      select.innerHTML = '';
      amigos.forEach(amigo => {
        const option = document.createElement('option');
        option.value = amigo; option.textContent = amigo;
        select.appendChild(option);
      });
      if (valorActual && amigos.includes(valorActual)) select.value = valorActual;
    }

    function agregarAmigo() {
      const nombre = prompt('¿Cómo se llama tu amigo?');
      if (nombre && nombre.trim() !== '') {
        const nombreLimpio = nombre.trim();
        if (!amigos.includes(nombreLimpio)) {
          amigos.push(nombreLimpio);
          localStorage.setItem('lista_amigos', JSON.stringify(amigos));
          inicializarSelect();
          document.getElementById('amigo-select').value = nombreLimpio;
          actualizarUI();
        } else {
          alert('Ese nombre ya existe.');
        }
      }
    }

    // SISTEMA DE LOGROS Y TÍTULOS
    function obtenerTitulo(gramos) {
      if (gramos >= 100) return '👑 Bling King';
      if (gramos >= 50) return '💎 Old Brother';
      if (gramos >= 20) return '🔥 OG';
      if (gramos >= 5) return '🛠️ Constructor';
      return '🌱 Iniciado';
    }

    function actualizarUI() {
      const amigoSeleccionado = document.getElementById('amigo-select').value;
      const historyList = document.getElementById('history-list');
      const rankingList = document.getElementById('ranking-list');
      const totalSpan = document.getElementById('total-grams');
      const frasco = document.getElementById('frasco');
      const sala = document.getElementById('sala');
      
      let totalesPorAmigo = {};
      amigos.forEach(a => totalesPorAmigo[a] = 0);

      historyList.innerHTML = '';
      rankingList.innerHTML = '';
      let totalPersonal = 0;

      registros.forEach((reg) => {
        const nombreAmigo = reg.amigo || 'Pedro';
        if (totalesPorAmigo[nombreAmigo] === undefined) totalesPorAmigo[nombreAmigo] = 0;
        totalesPorAmigo[nombreAmigo] += reg.gramos;

        if (nombreAmigo === amigoSeleccionado) {
          totalPersonal += reg.gramos;
          const li = document.createElement('li');
          li.className = 'data-item';
          li.innerHTML = `<span style="color:#aaa">${reg.fecha}</span> <strong>+${reg.gramos} g</strong>`;
          historyList.appendChild(li);
        }
      });

      totalSpan.textContent = totalPersonal.toFixed(1);

      let nuevaAnchura = 100 + (totalPersonal * 6);
      let nuevaAltura = 100 + (totalPersonal * 5);
      if (nuevaAnchura > 280) nuevaAnchura = 280;
      if (nuevaAltura > 200) nuevaAltura = 200;

      sala.style.width = nuevaAnchura + 'px';
      sala.style.height = nuevaAltura + 'px';

      frasco.innerHTML = '';
      let cantidadCogollos = Math.floor(totalPersonal);
      for (let i = 0; i < cantidadCogollos; i++) {
        const cogollo = document.createElement('span');
        cogollo.className = 'cogollo';
        cogollo.textContent = '🥦';
        frasco.appendChild(cogollo);
      }

      // Ranking con Títulos
      const rankingOrdenado = Object.keys(totalesPorAmigo).sort((a, b) => totalesPorAmigo[b] - totalesPorAmigo[a]);
      
      rankingOrdenado.forEach((amigo, index) => {
        const li = document.createElement('li');
        li.className = 'ranking-item';
        
        let medalla = '';
        if(index === 0) medalla = '🥇';
        else if(index === 1) medalla = '🥈';
        else if(index === 2) medalla = '🥉';
        else medalla = '🔹';

        const titulo = obtenerTitulo(totalesPorAmigo[amigo]);
        
        li.innerHTML = `
          <div class="ranking-info">
            <span class="ranking-name">${medalla} ${amigo}</span>
            <span class="ranking-title">${titulo}</span>
          </div>
          <span class="ranking-score">${totalesPorAmigo[amigo].toFixed(1)} g</span>
        `;
        rankingList.appendChild(li);
      });
    }

    function registrar(gramos) {
      const amigoActual = document.getElementById('amigo-select').value;
      const ahora = new Date();
      const fechaStr = ahora.toLocaleDateString([], {day: '2-digit', month: '2-digit'}) + ' ' + 
                       ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      registros.unshift({ fecha: fechaStr, gramos: gramos, amigo: amigoActual });
      localStorage.setItem('registros_gramos', JSON.stringify(registros));
      actualizarUI();
    }

    function limpiarHistorial() {
      if (confirm('¿Seguro que querés borrar TODO el historial?')) {
        registros = [];
        localStorage.removeItem('registros_gramos');
        actualizarUI();
      }
    }

    inicializarSelect();
    actualizarUI();
  </script>
</body>
</html>
